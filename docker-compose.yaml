version: '3.0'

# Demo-stack compose file. Three services:
#   clickhouse  — analytical store the plugin reads from
#   grafana     — runs Grafana with the hover plugin mounted from ./dist
#   otel-collector — tails /tmp/varied_logs.log and forwards via OTLP to
#                    the host-side Rust log-ingest-service (port 4317)
#
# Prerequisite for end-to-end ingest: the Rust log-ingest-service from
# ../log_analysis must be running on host:4317. The demo scripts in
# ./demo verify this before they start streaming.

services:
  clickhouse:
    container_name: 'clickhouse-server'
    image: clickhouse/clickhouse-server:latest
    ports:
      - 8123:8123
      - 9000:9000
    environment:
      - CLICKHOUSE_DB=default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./schema/admin_dashboard_schema.sql:/docker-entrypoint-initdb.d/01-admin.sql
      - ./schema/clickhouse_schema.sql:/docker-entrypoint-initdb.d/02-logs.sql
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    container_name: 'hover-tracker-panel'
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      - GF_DEFAULT_APP_MODE=development
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_LOG_LEVEL=debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=hover-hover-panel
    volumes:
      - ./dist:/var/lib/grafana/plugins/hover-hover-panel
      - ./provisioning:/etc/grafana/provisioning
      - ./config.toml:/var/lib/grafana/plugins/hover-hover-panel/config.toml
      - ./schema:/var/lib/grafana/plugins/hover-hover-panel/schema
      - ./cache:/var/lib/grafana/plugins/hover-hover-panel/cache
    user: "0"
    depends_on:
      clickhouse:
        condition: service_healthy

  otel-collector:
    container_name: 'otel-collector'
    image: otel/opentelemetry-collector-contrib:latest
    # HOST_IP is read from the environment so the collector can reach the
    # host-side Rust log-ingest-service via Docker Desktop's IPv4 host
    # routing (host.docker.internal is IPv6-first on macOS and the Rust
    # tonic 0.12 server only listens on IPv4).
    environment:
      - HOST_IP=${HOST_IP:-host.docker.internal}
    volumes:
      - ./demo/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /tmp/varied_logs.log:/logs/varied_logs.log:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
