apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    access: proxy
    url: http://clickhouse:8123
    isDefault: false
    editable: true
    jsonData:
      defaultDatabase: default
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      tlsSkipVerify: true
    secureJsonData:
      username: default
      password: ""
