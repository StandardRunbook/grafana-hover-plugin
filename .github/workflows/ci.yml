name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          # Track go.mod's required version automatically. A Go bump
          # there (driven by a dep that needs newer toolchain support,
          # e.g. covdata for grafana-plugin-sdk-go 0.292+) flows
          # through to CI without a separate workflow edit.
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage)
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.txt | tail -30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          flags: go
          fail_ci_if_error: false

      - name: Build backend
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin (frontend)
        run: pnpm run build

      - name: Build plugin (backend, all platforms)
        # plugin.json's `executable: gpx_hover-hover-panel` requires the
        # backend binary set in the archive. `pnpm run build` only does
        # webpack, so cross-compile here for the five platforms Grafana
        # supports. Mode 0755 satisfies the validator's perm check.
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="dist/gpx_hover-hover-panel_${os}_${arch}${ext}"
            GOOS=$os GOARCH=$arch go build -o "$out" ./pkg
            chmod 0755 "$out"
          done
          ls -la dist/gpx_*

      - name: Validate plugin
        run: |
          # @grafana/plugin-validator >= 0.40 wants a zip whose root
          # contains exactly one directory named after the plugin id.
          # Stage the dist tree under that directory before zipping.
          PLUGIN_ID=$(node -p "require('./src/plugin.json').id")
          rm -rf _stage && mkdir _stage
          cp -r dist "_stage/${PLUGIN_ID}"
          # Backend plugin binaries must be 0755; pnpm build copies them
          # in 0644 in CI (host is umask 0022). Validator rejects anything else.
          chmod 0755 "_stage/${PLUGIN_ID}"/gpx_* 2>/dev/null || true
          (cd _stage && zip -qr "../${PLUGIN_ID}.zip" "${PLUGIN_ID}")
          npx @grafana/plugin-validator@latest "${PLUGIN_ID}.zip"

# Cypress-based e2e job removed — the `pnpm run e2e` script depends on
# cypress, which isn't a direct devDependency, and the suite was never
# wired up beyond the @grafana/e2e scaffolding. The Playwright-based
# end-to-end tests live in /tmp/pwtest and are run against a live demo
# stack; reintroduce a real e2e CI job once those land in the repo.
