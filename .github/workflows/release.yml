name: Release Plugin

# Triggers
# --------
# Push of a strict-semver tag (`v1.2.3` / `v1.2.3-rc.1`) — production path.
# `workflow_dispatch` accepts an explicit version input for manual replays
# (e.g. re-running a failed release from the Actions UI without retagging).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3 — without leading v)'
        required: true
        type: string

# Serialize releases on the same ref so a re-pushed tag or rapid
# back-to-back pushes don't race for the same release artifact.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC token for build provenance
  attestations: write   # publish the attestation

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # ---- toolchains ----
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ---- resolve version + plugin id ----
      # `version` drives the release artifact name. `plugin_id` (read from
      # plugin.json) is the canonical id used by Grafana's catalog and by
      # the validator's expected zip layout.
      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # github.ref_name strips refs/tags/ for tag pushes
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PLUGIN_ID=$(node -p "require('./src/plugin.json').id")
          {
            echo "version=$VERSION"
            echo "plugin_id=$PLUGIN_ID"
            echo "tag=v$VERSION"
            echo "artifact=${PLUGIN_ID}-${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

      # ---- pre-release gates ----
      # These mirror ci.yml so a tag can't ship if the codebase wouldn't
      # have passed CI on that commit. Kept inline (rather than as a
      # reusable workflow) because the artifact path needs the same
      # checkout context as the release steps.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Frontend tests
        run: pnpm run test:ci

      - name: Backend tests
        run: go test -race ./...

      # ---- build artifacts ----
      - name: Build frontend
        run: pnpm run build

      - name: Build backend (all supported platforms)
        # plugin.json declares `executable: gpx_hover-hover-panel`, so
        # every platform's binary must be present in dist/. Mode 0755
        # satisfies the validator's permission check.
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"
            out="dist/gpx_hover-hover-panel_${os}_${arch}${ext}"
            GOOS=$os GOARCH=$arch go build -o "$out" ./pkg
            chmod 0755 "$out"
          done

      # ---- optional: sign for the Grafana plugin catalog ----
      # Sign-plugin reads GRAFANA_ACCESS_POLICY_TOKEN from the env; we
      # bring the secret into the env unconditionally and let the script
      # itself decide whether to sign. This avoids the
      # `if: secrets.* != ''` anti-pattern (which causes a workflow
      # startup error because secrets aren't available in `if:` contexts)
      # and keeps the signing decision visible in the run log.
      - name: Sign plugin (if access token is configured)
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [[ -z "${GRAFANA_ACCESS_POLICY_TOKEN:-}" ]]; then
            echo "GRAFANA_ACCESS_POLICY_TOKEN secret not set — skipping signing."
            echo "The release will be published as an unsigned plugin."
            exit 0
          fi
          npx --yes @grafana/sign-plugin@latest

      # ---- validate ----
      # Match the validator's required layout: a zip whose root contains
      # exactly one directory named after plugin.json#id. Same staging
      # logic as ci.yml — kept identical here so the release path is
      # provably equivalent to what CI exercises on every commit.
      - name: Validate plugin
        run: |
          set -euo pipefail
          rm -rf _stage && mkdir _stage
          cp -r dist "_stage/${{ steps.meta.outputs.plugin_id }}"
          chmod 0755 "_stage/${{ steps.meta.outputs.plugin_id }}"/gpx_* 2>/dev/null || true
          (cd _stage && zip -qr "../${{ steps.meta.outputs.plugin_id }}.zip" "${{ steps.meta.outputs.plugin_id }}")
          npx --yes @grafana/plugin-validator@latest "${{ steps.meta.outputs.plugin_id }}.zip"

      # ---- package the release artifact ----
      # The validator zip uses just the plugin id as a name; the release
      # artifact additionally embeds the version. Build that here from
      # the same staged tree so we don't repackage twice.
      - name: Package release artifact
        id: package
        run: |
          set -euo pipefail
          (cd _stage && zip -qr "../${{ steps.meta.outputs.artifact }}" "${{ steps.meta.outputs.plugin_id }}")
          ls -la "${{ steps.meta.outputs.artifact }}"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.meta.outputs.artifact }}

      # ---- publish ----
      # `make_latest: legacy` matches GitHub's default semver-aware
      # behavior: the highest-versioned non-prerelease tag becomes
      # "latest", and prereleases (vX.Y.Z-rc.N) don't displace it.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.meta.outputs.artifact }}
          generate_release_notes: true
          make_latest: legacy
          fail_on_unmatched_files: true
